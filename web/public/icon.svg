<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" role="img" aria-label="product-rating">
  <!--
    App mark: a barcode above a row of five stars - the two things the app is
    about, scanning and rating. Drawn once here and rasterised into the PNG
    sizes the manifest and iOS need by `npm run icons`
    (web/scripts/generate-icons.ts).

    The coordinate grid is the one of the artwork this mark was taken from: 360
    units square, every bar on a 3 unit grid, so the widths stay in the 1:2:3
    ratio a barcode reads as. The stars sit on a 50 unit pitch, radius 21.5,
    inner radius 0.382 of that - the classic five pointed star.

    The corner radius matches what a phone home screen expects of an icon that
    is not masked by the platform; the maskable variant in icon-maskable.svg
    leaves the rounding to the platform instead.
  -->
  <rect width="360" height="360" rx="79" fill="#16a34a" />
  <g fill="#ffffff">
    <rect x="62" y="76" width="6" height="128" />
    <rect x="71" y="76" width="3" height="128" />
    <rect x="80" y="76" width="9" height="128" />
    <rect x="95" y="76" width="3" height="128" />
    <rect x="104" y="76" width="6" height="128" />
    <rect x="113" y="76" width="9" height="128" />
    <rect x="128" y="76" width="3" height="128" />
    <rect x="140" y="76" width="6" height="128" />
    <rect x="149" y="76" width="3" height="128" />
    <rect x="161" y="76" width="3" height="128" />
    <rect x="170" y="76" width="6" height="128" />
    <rect x="179" y="76" width="9" height="128" />
    <rect x="194" y="76" width="3" height="128" />
    <rect x="206" y="76" width="6" height="128" />
    <rect x="215" y="76" width="3" height="128" />
    <rect x="227" y="76" width="3" height="128" />
    <rect x="233" y="76" width="6" height="128" />
    <rect x="251" y="76" width="3" height="128" />
    <rect x="260" y="76" width="6" height="128" />
    <rect x="275" y="76" width="9" height="128" />
    <rect x="287" y="76" width="3" height="128" />
    <rect x="293" y="76" width="6" height="128" />
  </g>
  <g fill="#ffc93c">
    <path d="M 80 243 L 84.8 257.9 L 100.4 257.9 L 87.8 267 L 92.6 281.9 L 80 272.7 L 67.4 281.9 L 72.2 267 L 59.6 257.9 L 75.2 257.9 Z" />
