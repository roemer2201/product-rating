<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="product-rating">
  <!--
    App mark: a barcode with a star above it — the two things the app is about,
    scanning and rating. Drawn once here and rasterised into the PNG sizes the
    manifest and iOS need by `npm run icons` (web/scripts/generate-icons.ts).

    The corner radius matches what a phone home screen expects of an icon that
    is not masked by the platform; the maskable variant in icon-maskable.svg
    leaves the rounding to the platform instead.
  -->
  <rect width="512" height="512" rx="112" fill="#2f5fd0" />
  <g fill="#ffffff">
    <path d="M 256 96 L 275.3 155.4 L 337.8 155.4 L 287.2 192.2 L 306.5 251.6 L 256 214.9 L 205.5 251.6 L 224.8 192.2 L 174.2 155.4 L 236.7 155.4 Z" />
    <rect x="104" y="284" width="16" height="120" rx="8" />
    <rect x="136.6" y="284" width="32" height="120" rx="8" />
    <rect x="185.1" y="284" width="16" height="120" rx="8" />
    <rect x="217.7" y="284" width="16" height="120" rx="8" />
    <rect x="250.3" y="284" width="44" height="120" rx="8" />
    <rect x="310.9" y="284" width="16" height="120" rx="8" />
    <rect x="343.4" y="284" width="32" height="120" rx="8" />
    <rect x="392" y="284" width="16" height="120" rx="8" />
  </g>
</svg>
