  <!--
    The same mark for the `maskable` purpose and for iOS.

    Two differences to icon.svg: the background fills the whole square, because
    Android and iOS cut their own shape out of it, and the mark is scaled down
    so it stays inside the safe zone - the circle of 80 % diameter that every
    mask is guaranteed to leave visible.
  -->
