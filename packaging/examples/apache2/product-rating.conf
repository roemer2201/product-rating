# product-rating behind Apache 2.4.
#
#   a2enmod proxy proxy_http headers ssl deflate rewrite
#   cp product-rating.conf /etc/apache2/sites-available/product-rating.conf
#   a2ensite product-rating
#   apache2ctl configtest && systemctl reload apache2
#
# Adjust: ServerName, the two certificate paths and the address of the
# application if it does not run on this host.
#
# The application answers the interface and /api/v1 from one process, so there
# is a single ProxyPass and no split into a static root and an API location.
# TLS ends here; the application speaks plain HTTP on the loopback interface.
#
# Three settings have to match what the application is configured with:
#
#   * server.base_url must be the address below (https://produkte.example.org).
#     Every writing request is checked against it - a mismatch lets the
#     interface load and then fails every save with 403.
#   * server.trust_proxy must be true, so the log and the login rate limit see
#     the client instead of this proxy.
#   * the size limit below has to be at least uploads.max_file_size_mb.

# Plain HTTP exists only to send the browser to HTTPS: without a secure context
# the browser refuses access to the camera, and the scanner is the main
# function of this application.
<VirtualHost *:80>
    ServerName produkte.example.org

    # Leave in place if certbot renews the certificate over HTTP-01.
    DocumentRoot /var/www/html
    <Location "/.well-known/acme-challenge/">
        ProxyPass "!"
    </Location>

    RedirectMatch permanent "^/(?!\.well-known/acme-challenge/)(.*)" \
        "https://produkte.example.org/$1"
</VirtualHost>

<VirtualHost *:443>
    ServerName produkte.example.org

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/produkte.example.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/produkte.example.org/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    ErrorLog  ${APACHE_LOG_DIR}/product-rating.error.log
    CustomLog ${APACHE_LOG_DIR}/product-rating.access.log combined

    # Photos are the largest thing that travels here. In bytes, at least
    # uploads.max_file_size_mb of the application (15 MB by default) plus the
    # overhead of the multipart body; 20 MiB leaves room for both.
    #
    # LimitRequestBody alone is NOT enough in front of a proxy: measured
    # against Apache 2.4.58, a request handled by mod_proxy passes it by, at
    # the virtual host as well as inside a Location - the body is streamed to
    # the backend without the core ever counting it. It stays here because it
    # does cover everything Apache serves itself.
    LimitRequestBody 20971520

    # ... and this is what actually stops an oversized upload. The announced
    # length is checked before the body is read, and the answer is the 413 the
    # interface expects. Needs mod_rewrite.
    #
    # A client that sends no Content-Length (chunked) slips past it; that is
    # what the limit inside the application is for, which then answers with a
    # readable error instead of a bare status.
    RewriteEngine On
    RewriteCond expr "-T req('Content-Length') && %{HTTP:Content-Length} -gt 20971520"
    RewriteRule ^ - [R=413,L]

    # A photo from a phone travels over a slow uplink and is re-encoded by the
    # application afterwards. Both together outlast the default of 60 seconds.
    ProxyTimeout 120

    # The Host header of the browser is passed through, so the application logs
    # and links the name the client actually used.
    ProxyPreserveHost On

    # mod_proxy sets X-Forwarded-For and X-Forwarded-Host by itself, but not
    # this one - and without it the application would take the connection to
    # itself for plain HTTP.
    RequestHeader set X-Forwarded-Proto "https"

    # An id or a code in an address may be percent encoded, and a %2F in it has
    # to survive: NoDecode leaves it alone here, nocanon below stops mod_proxy
    # from normalising the address before it forwards. Without the pair Apache
    # answers such a request with 404 all by itself.
    AllowEncodedSlashes NoDecode

    ProxyPass        / http://127.0.0.1:8080/ nocanon timeout=120
    ProxyPassReverse / http://127.0.0.1:8080/

    # Compression for the bundle and the API answers. Images are WebP and
    # already compressed, so they stay out. Needs mod_deflate.
    AddOutputFilterByType DEFLATE text/html text/plain text/css \
        application/javascript application/json application/manifest+json \
        image/svg+xml

    # "always" so the header is set on error responses as well. Only HSTS is
    # left here: the remaining hardening headers - Content-Security-Policy,
    # X-Content-Type-Options, Referrer-Policy, X-Frame-Options,
    # Permissions-Policy - are set by the application itself since M14, which
    # is the one place that knows its own bundle. HSTS stays because the
    # application speaks plain HTTP behind this proxy and cannot tell whether
    # there is really a certificate in front of it.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    # No caching rules here, and that is on purpose. The application sets
    # Cache-Control itself and is the only place that can tell the two cases
    # apart: the names of the files under /assets/ contain a hash of their
    # content and are immutable for a year, while index.html, sw.js and the
    # manifest keep their names across releases and are sent as no-cache. A
    # mod_expires rule (ExpiresByType) or a Header set Cache-Control would
    # overwrite exactly that and leave installed home screen apps on an old
    # bundle for as long as the value says.
</VirtualHost>
