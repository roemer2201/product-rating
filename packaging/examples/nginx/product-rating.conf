# product-rating behind nginx - one instance on its own host name.
#
#   cp product-rating.conf /etc/nginx/sites-available/product-rating
#   ln -s ../sites-available/product-rating /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Adjust: server_name, the two certificate paths, and the address in the
# upstream block if the application does not run on this host.
#
# The application answers the interface and /api/v1 from the same process, so
# there is exactly one proxy_pass and no split between a static root and an
# API location. TLS ends here; the application itself speaks plain HTTP on the
# loopback interface.
#
# Three settings have to match what the application is configured with:
#
#   * server.base_url must be the address below (https://produkte.example.org).
#     Every writing request is checked against it, so a mismatch lets the
#     interface load and then makes every save fail with 403.
#   * server.trust_proxy must be true, otherwise the log and the login rate
#     limit see this proxy instead of the client.
#   * client_max_body_size below has to be at least uploads.max_file_size_mb.

upstream product_rating {
    server 127.0.0.1:8080;

    # Keeps connections open between nginx and the application instead of
    # opening a new one per request. Needs the two proxy_http_version and
    # Connection settings in the location below.
    keepalive 16;
}

# Plain HTTP exists only to send the browser to HTTPS. The camera of the
# scanner is unavailable without a secure context, so an instance reached over
# HTTP is not merely unencrypted, it is missing its main function.
server {
    listen 80;
    listen [::]:80;
    server_name produkte.example.org;

    # Leave this in place if certbot renews the certificate over HTTP-01.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Separate directive since nginx 1.25.1. Older versions (Debian 12 with
    # 1.22, Ubuntu 24.04 with 1.24) do not know it and want the option on the
    # listen directives instead: "listen 443 ssl http2;".
    http2 on;
    server_name produkte.example.org;

    ssl_certificate     /etc/letsencrypt/live/produkte.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/produkte.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;

    # Photos are the largest thing that travels here. The value has to be at
    # least uploads.max_file_size_mb of the application (15 MB by default) plus
    # the overhead of the multipart body; 20m leaves room for both. Too small a
    # value fails the upload inside nginx with 413, and the interface only sees
    # a broken connection.
    client_max_body_size 20m;

    # A photo from a phone travels over a slow uplink and is then re-encoded by
    # the application. Both take longer than the defaults of 60 seconds allow
    # on a bad connection.
    client_body_timeout 120s;
    proxy_read_timeout  120s;
    proxy_send_timeout  120s;

    # Compression for the bundle and the API answers. Proxied responses are
    # excluded by default, which is why gzip_proxied is needed here. Images are
    # WebP and already compressed, so they stay out.
    gzip             on;
    gzip_proxied     any;
    gzip_vary        on;
    gzip_min_length  1024;
    gzip_types       text/css text/plain application/javascript application/json
                     application/manifest+json image/svg+xml;

    # Only HSTS, and "always" so it is also set on the error pages nginx
    # produces when the application is down.
    #
    # The remaining hardening headers - Content-Security-Policy,
    # X-Content-Type-Options, Referrer-Policy, X-Frame-Options,
    # Permissions-Policy - are set by the application itself since M14. It is
    # the one place that knows its own bundle, and add_header appends rather
    # than replaces: a second copy here would reach the browser twice. HSTS
    # stays because the application speaks plain HTTP behind this proxy and
    # cannot tell whether there is really a certificate in front of it.
    #
    # Note that a single add_header anywhere further in (a location block, for
    # instance) replaces this whole list for that block. If a location needs
    # its own header, it has to repeat these.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/product-rating.access.log;
    error_log  /var/log/nginx/product-rating.error.log;

    location / {
        proxy_pass http://product_rating;

        # Required for the keepalive of the upstream block: HTTP/1.1 and an
        # empty Connection header, so nginx does not forward "close".
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # No caching rules for /assets/ here, and that is on purpose. The
        # application sets Cache-Control itself and is the only place that can
        # tell the two cases apart: the file names under /assets/ contain a
        # hash of their content and are immutable for a year, while index.html,
        # sw.js and the manifest keep their names across releases and are sent
        # as no-cache. An expires or add_header Cache-Control rule here would
        # overwrite exactly that and leave installed home screen apps on an old
        # bundle for as long as the value says.
        #
        # proxy_cache is off by default and should stay off: media are
        # delivered through an authenticated route with Cache-Control: private.
    }
}
