# product-rating under a sub-path of an existing host, for example
# https://heim.example.org/produkte/ next to other services on the same name.
#
# This costs one extra step compared with an own host name: the client has to
# be BUILT for that path. index.html, the manifest, the service worker and the
# API address of the bundle all carry it, and none of them can be rewritten
# afterwards by a proxy.
#
#   Debian package:  PRODUCT_RATING_BASE_PATH=/produkte npm run package:deb
#   Docker:          docker build --build-arg PRODUCT_RATING_BASE_PATH=/produkte \
#                      -f docker/Dockerfile -t product-rating .
#
# The prefix ends here: proxy_pass below carries a trailing slash, so nginx
# strips /produkte before forwarding. The application keeps answering on / and
# /api/v1 and has no setting for a base path - it does not need one.
#
# Settings in the application:
#
#   * server.base_url = https://heim.example.org/produkte
#   * server.trust_proxy = true
#
# One instance per host name is the simpler arrangement. Two instances under
# two sub-paths of the SAME host name do not work: the session cookie is set
# for path / and both would overwrite each other's.

upstream product_rating {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Since nginx 1.25.1; older versions want "listen 443 ssl http2;" instead.
    http2 on;
    server_name heim.example.org;

    ssl_certificate     /etc/letsencrypt/live/heim.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/heim.example.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # ... other services of this host ...

    # Without this a link to /produkte lands one directory too high: the client
    # resolves its own addresses against the prefix and needs the slash.
    location = /produkte {
        return 308 https://$host/produkte/;
    }

    location /produkte/ {
        # The trailing slash is what makes this work: it replaces the matched
        # /produkte/ with /, so the application sees /api/v1/… where the
        # browser asked for /produkte/api/v1/….
        proxy_pass http://product_rating/;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Same limits as in the variant with an own host name; they belong to
        # the location here, because the rest of the host has nothing to do
        # with photo uploads.
        client_max_body_size 20m;
        client_body_timeout  120s;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;

        # Repeated on purpose: an add_header anywhere in this block would
        # otherwise replace the list of the enclosing server block for it. The
        # Cache-Control and hardening headers of the application are passed
        # through untouched - see the comment in product-rating.conf.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
