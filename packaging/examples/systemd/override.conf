# Local changes to the product-rating unit.
#
#   systemctl edit product-rating          # opens exactly this drop-in
#
# ... and paste what is needed from below. The file ends up in
# /etc/systemd/system/product-rating.service.d/override.conf and survives every
# upgrade - unlike /usr/lib/systemd/system/product-rating.service, which the
# package replaces.
#
# After editing by hand rather than through "systemctl edit":
#
#   systemctl daemon-reload && systemctl restart product-rating
#
# Everything here is commented out. A drop-in that sets nothing changes
# nothing.

[Service]

# --- Data somewhere else ---------------------------------------------------
# The unit runs with ProtectSystem=strict: the whole file system is read only
# apart from the paths it names. A data directory outside /var/lib is therefore
# not enough on its own - it also has to be listed here, or the service starts
# and fails on the first write.
#
# Both settings belong together: the path for the application, the path for
# systemd. Alternatively the paths can be set in
# /etc/product-rating/config.toml; the ReadWritePaths line is needed either
# way.
#
#Environment=PR_PATHS__DATABASE=/srv/product-rating/db/app.db
#Environment=PR_PATHS__UPLOADS=/srv/product-rating/uploads
#Environment=PR_PATHS__TEMP=/srv/product-rating/tmp
#ReadWritePaths=/srv/product-rating
#
# A network share (NFS, CIFS) as the data directory additionally needs the
# mount to be there before the service starts - see the [Unit] section at the
# end of this file. The database really should stay on local storage anyway:
# SQLite and network locks are a bad pairing.
#
# ReadWritePaths adds to the list of the unit, it does not replace it. To
# replace it, an empty assignment has to come first:
#
#ReadWritePaths=
#ReadWritePaths=/srv/product-rating /var/log/product-rating

# --- A different address or port -------------------------------------------
# The port is free above 1024. Below it the service needs the capability to
# bind, and the empty CapabilityBoundingSet of the unit has to be widened -
# which is exactly what the reverse proxy in front exists to avoid.
#
#Environment=PR_SERVER__PORT=8090
#
# Reachable from the network without a proxy - only sensible with TLS in front,
# because the browser refuses the camera without a secure context:
#
#Environment=PR_SERVER__HOST=0.0.0.0

# --- More logging ----------------------------------------------------------
# Goes to the journal, so "journalctl -u product-rating -f" shows it.
#
#Environment=PR_LOG__LEVEL=debug

# --- A different configuration file ----------------------------------------
#Environment=PRODUCT_RATING_CONFIG=/etc/product-rating/other.toml


# --- Start-up order --------------------------------------------------------
# Note the section: dependencies and ordering belong to [Unit]. In [Service]
# systemd ignores them with an "Unknown key name" in the log and starts anyway
# - at the wrong moment.
#
# The unit already waits for network-online.target. A data directory on a
# mounted volume belongs here, so the service does not start before the mount
# is there:

[Unit]
#RequiresMountsFor=/srv/product-rating
