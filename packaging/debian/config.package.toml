# product-rating - configuration installed by the Debian package
#
# The package ships this file as /etc/product-rating/config.toml and registers
# it as a conffile, so edits made here survive an upgrade: dpkg asks before it
# touches a file that was changed by hand.
#
# It differs from config/config.example.toml only where the package layout
# needs it to - the web client below /opt, the data below /var/lib, the secret
# in /etc. Everything left out keeps its built-in default; the full list with
# comments is in config/config.example.toml, in the repository and below
# /usr/share/doc/product-rating/.
#
# Single values can also be set without editing this file, through
# PR_<SECTION>__<KEY> environment variables in a systemd drop-in:
#
#   systemctl edit product-rating
#   [Service]
#   Environment=PR_SERVER__BASE_URL=https://products.example.org

[server]
# The service listens on the loopback interface and expects a reverse proxy in
# front of it. Binding to 0.0.0.0 without one exposes an application that has
# no TLS of its own - and without TLS the browser refuses the camera.
host = "127.0.0.1"
port = 8080
# The address the browser uses. Every writing request is checked against it, so
# a wrong value here ends in rejected logins rather than in a broken link.
base_url = "http://127.0.0.1:8080"
# Enable together with a reverse proxy, so the client address in the log and in
# the login rate limit is the real client and not the proxy. Only with a proxy
# that sets X-Forwarded-For itself; otherwise a client can claim any address.
trust_proxy = false
# The built web client, delivered by the server itself.
static_dir = "/opt/product-rating/web"

[paths]
# Database, photos and temporary files. Free to point somewhere else, a NAS
# mount for instance; the systemd unit then needs that path in ReadWritePaths,
# which is what the override.conf template is for.
database = "/var/lib/product-rating/db/app.db"
uploads = "/var/lib/product-rating/uploads"
temp = "/var/lib/product-rating/tmp"

[auth]
# Generated by the postinst on the first install, with mode 0600, and kept out
# of this file on purpose. Removed when the package is purged.
secret_file = "/etc/product-rating/secret.env"

[log]
# Under systemd, stdout is the journal: "journalctl -u product-rating" shows
# the log, and it is rotated by the journal's own limits. Switching this to
# "file" writes to log.file instead, which is where the shipped logrotate rule
# in /etc/logrotate.d/product-rating comes in.
level = "info"
format = "json"
destination = "stdout"
file = "/var/log/product-rating/app.log"
