# Continuous integration.
#
# Runs exactly what CLAUDE.md asks for before a commit - format, lint, types,
# tests, build - and then the two things that only break when nobody looks:
# the Debian package and the container image. Both are built here and thrown
# away; publishing happens in release.yml on a tag.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Nothing here writes to the repository.
permissions:
  contents: read

# A second push onto the same branch makes the first run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every merge into main has to produce a new version (README 9.1), otherwise
  # a package built from main carries the number of the one before and an
  # installation cannot tell them apart. Only pull requests are checked: a
  # push onto a working branch is allowed to leave the version alone until the
  # branch is ready.
  version:
    name: Version raised
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # A pull request checks out the merge result, so the version here is
      # what main would carry after the merge.
      - uses: actions/checkout@v4

      - name: Compare with the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${BASE_REF}"
          base="$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          head="$(node -p 'require("./package.json").version')"
          # Plain MAJOR.MINOR.PATCH only; server/src/version.test.ts rejects
          # anything else, so there is no pre-release ordering to handle.
          node -e '
            const [base, head] = process.argv.slice(1);
            const parse = (v) => {
              if (!/^\d+\.\d+\.\d+$/.test(v)) throw new Error(`not MAJOR.MINOR.PATCH: ${v}`);
              return v.split(".").map(Number);
            };
            const [b, h] = [parse(base), parse(head)];
            const order = h[0] - b[0] || h[1] - b[1] || h[2] - b[2];
            if (order <= 0) {
              console.error(`version ${head} is not higher than ${base} on the base branch`);
              console.error("raise it before merging, see README 9.1:");
              console.error("  npm version <minor|patch> --workspaces --include-workspace-root --no-git-tag-version");
              console.error("  and a new entry at the top of packaging/debian/changelog");
              process.exit(1);
            }
            console.log(`version ${base} -> ${head}`);
          ' "${base}" "${head}"

  checks:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci rather than install: the lock file is the authority, and a
      # dependency that quietly moved has to fail here.
      - run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Diagnose formatting
        if: failure()
        run: |
          npx prettier --write web/src/routes/ProductPage.test.tsx
          git diff -- web/src/routes/ProductPage.test.tsx

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The completion test checks packaging/completion/ against the real
      # library as well, and skips that part where it is missing.
      - name: Install bash-completion
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes bash-completion

      - name: Test
        run: npm test

      # Last, because it is the slowest and the least likely to fail on its
      # own: what it proves is that server bundle and web client still build.
      - name: Build
        run: npm run build

  package:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # build-deb.sh uses lintian when it is there, and a packaging mistake is
      # exactly what it finds.
      - name: Install lintian
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes lintian

      - name: Build the package
        run: npm run package:deb

      # The package wants nodejs (>= 22), which neither Ubuntu 24.04 nor Debian
      # 13 have in their own archive - the installation instructions say the
      # same (README 7.2). This is the step a person would do first.
      - name: Install Node.js from NodeSource
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install --yes nodejs

      - name: Check that it installs, starts and answers
        run: |
          set -euo pipefail
          package="$(find packaging/build -maxdepth 1 -name '*.deb' -print -quit)"
          sudo apt-get install --yes "${PWD}/${package}"

          # postinst creates the user, the directories and the secret and
          # applies the migrations, but deliberately does not start a fresh
          # installation - base_url has to be set first (README 7.2). The
          # shipped default is the loopback address used here.
          sudo systemctl start product-rating
          curl --fail --silent --show-error --retry 10 --retry-delay 2 \
            --retry-all-errors http://127.0.0.1:8080/healthz

          # Removing has to leave the data behind, purging has to take the
          # configuration with it; both are maintainer script paths that only
          # ever run on someone's machine.
          sudo systemctl stop product-rating
          sudo apt-get remove --yes product-rating
          test -d /var/lib/product-rating
          sudo apt-get purge --yes product-rating
          test ! -e /etc/product-rating

      - uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: packaging/build/*.deb
          retention-days: 7

  image:
    name: Container image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build --file docker/Dockerfile --tag product-rating:ci .

      - name: Check that it starts and answers
        run: |
          set -euo pipefail
          docker run --detach --name product-rating-ci \
            --publish 127.0.0.1:8080:8080 product-rating:ci
          # The entrypoint creates the secret and applies the migrations first,
          # so the first attempts are expected to fail.
          curl --fail --silent --show-error --retry 20 --retry-delay 2 \
            --retry-all-errors http://127.0.0.1:8080/healthz
          docker logs product-rating-ci
          docker rm --force product-rating-ci
